[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-engine"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pyyaml", "lxml", "cssselect"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "playwright"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]